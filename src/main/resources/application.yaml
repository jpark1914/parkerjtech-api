spring:
  application:
    name: backendserviceapi
  datasource:
    url: ${CRM_DATABASE_URL:jdbc:h2:file:./data/smart-crm}
    username: ${CRM_DATABASE_USERNAME:sa}
    password: ${CRM_DATABASE_PASSWORD:}
  session:
    timeout: 24h
    jdbc:
      initialize-schema: never
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 24h
  error:
    include-message: never
    include-stacktrace: never
crm:
  cleanup:
    enabled: true
    delay-ms: 900000
